# The same headers for the public booking pages only (/book/ and /reserve/), which a business may show inside its own website in a frame.
# Only difference: any site may frame them (frame-ancestors *, no X-Frame-Options). Nothing else on flowxp.in is frameable.
# Install next to the other snippet: sudo cp deploy/nginx-embeddable-headers.conf /etc/nginx/snippets/flowxp-embeddable-headers.conf

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.bigdatacloud.net http://127.0.0.1:* http://localhost:*; frame-src https://www.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
