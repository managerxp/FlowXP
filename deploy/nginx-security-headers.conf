# FlowXP security headers for the built frontend, included by deploy/nginx.conf in the server block AND in every
# location that sets its own add_header (nginx drops inherited add_header lines in any location that has one).
#
# Install next to the site config:
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/flowxp-security-headers.conf
#
# Content-Security-Policy, line by line:
#   default-src 'self'                  anything not listed below comes only from flowxp.in itself
#   script-src 'self'                   no inline or third-party scripts (the JSON-LD block in index.html is data, not run)
#   style-src 'self' 'unsafe-inline'    the built stylesheet, plus style attributes some components set
#   img-src 'self' data: blob: https:   product photos and logos may come from the S3 bucket (S3_PUBLIC_URL)
#   font-src 'self' data:               Plus Jakarta Sans is self-hosted
#   connect-src                         the API (same origin), the onboarding address lookup, and the FlowXP print
#                                       agent on the counter PC (127.0.0.1 / localhost, any port the agent is set to)
#   frame-src https://www.google.com    the map on the onboarding screen
#   worker-src 'self'                   the service worker (sw.js)
#   object-src 'none', base-uri 'self', form-action 'self', frame-ancestors 'self'
# No upgrade-insecure-requests: it would rewrite the print agent's http://127.0.0.1 address to https and break it.
# If the browser console shows "Refused to ... Content Security Policy", add that source to the matching line here.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.bigdatacloud.net http://127.0.0.1:* http://localhost:*; frame-src https://www.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
