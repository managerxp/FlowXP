# FlowXP site config for a native nginx (no containers): serves the built
# frontend and forwards /api and /uploads to the PM2-managed API on
# 127.0.0.1:5100, so the browser only ever talks to one origin.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/flowxp
#   sudo cp deploy/nginx-security-headers.conf /etc/nginx/snippets/flowxp-security-headers.conf
#   sudo ln -s /etc/nginx/sites-available/flowxp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d flowxp.in -d www.flowxp.in      # TLS; see DEPLOY.md
#
# Check the root path for your server before enabling.
server {
  listen 80;
  server_name www.flowxp.in;
  return 301 https://flowxp.in$request_uri;
}

server {
  listen 80;
  server_name flowxp.in;
  root /var/www/flowxp/frontend/dist;
  index index.html;
  client_max_body_size 30m;        # menu photos (up to 5 x 8 MB, resized in the browser first)

  # Security headers (CSP, nosniff, frame and referrer policy, HSTS) live in one snippet. It is included here for
  # the locations that set no header of their own, and again inside every location that does, because nginx drops
  # inherited add_header lines in any location with its own. (Before this, index.html went out without them.)
  include /etc/nginx/snippets/flowxp-security-headers.conf;

  location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;        # reading a menu photo can take a while
  }

  # photos when STORAGE_DRIVER=local (with s3 they come straight from the bucket)
  location /uploads/ {
    proxy_pass http://127.0.0.1:5100;
    expires 7d;
  }

  # robots, sitemap and llms.txt change with the site, so they are re-checked too
  location = /robots.txt {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri =404;
  }
  location = /llms.txt {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    default_type "text/plain; charset=utf-8";
    try_files $uri =404;
  }

  # the service worker and the manifest must always be re-checked, or an update never reaches the phones
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri =404;
  }

  # hashed build assets never change: cache them hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri =404;
  }

  # single-page app: any other path is the app
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/flowxp-security-headers.conf;
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
}
