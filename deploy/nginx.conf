# FlowXP site config for a native nginx (no containers): serves the built
# frontend and forwards /api and /uploads to the PM2-managed API on
# 127.0.0.1:5100, so the browser only ever talks to one origin.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/flowxp
#   sudo ln -s /etc/nginx/sites-available/flowxp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com      # TLS; see DEPLOY.md
#
# Replace app.example.com and the root path for your server before enabling.
server {
  listen 80;
  server_name app.example.com;
  root /var/www/flowxp/frontend/dist;
  index index.html;
  client_max_body_size 30m;        # menu photos (up to 5 x 8 MB, resized in the browser first)

  location /api/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;        # reading a menu photo can take a while
  }

  # photos when STORAGE_DRIVER=local (with s3 they come straight from the bucket)
  location /uploads/ {
    proxy_pass http://127.0.0.1:5100;
    expires 7d;
  }

  # the service worker and the manifest must always be re-checked, or an update never reaches the phones
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # hashed build assets never change: cache them hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # single-page app: any other path is the app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
