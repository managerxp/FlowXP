# Serves the built app and forwards API calls, so the browser only ever talks to one origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 30m;        # menu photos (up to 5 x 8 MB, resized in the browser first)

  # the API (compose service name "api")
  location /api/ {
    proxy_pass http://api:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;        # reading a menu photo can take a while
  }

  # photos when STORAGE_DRIVER=local (with s3 they come straight from the bucket)
  location /uploads/ {
    proxy_pass http://api:5100;
    expires 7d;
  }

  # hashed build assets never change: cache them hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # single-page app: any other path is the app
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
